[project]
name = "pointcloud-projection"
version = "0.1.0"
description = "Project 3D point clouds to the XY plane after alignment preprocessing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.1.0",
  "open3d>=0.19.0",
  "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
pointcloud-project = "pointcloud_projection.cli:main"
stl-to-ply = "pointcloud_projection.stl_to_ply:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
